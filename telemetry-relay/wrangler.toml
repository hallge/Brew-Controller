# Cloudflare Worker for the Brew Controller diagnostics relay. See README.md for the setup.
#
# This file is in a public repository: it holds no secrets and no account id.
# Wrangler finds the account from `npx wrangler login`. The secrets are set with
# `npx wrangler secret put` and live only in Cloudflare.

name = "bbw-telemetry-relay"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# The admin console's pages (admin/) are bundled into src/admin-pages.js before each deploy.
[build]
command = "node tools/build-admin.mjs"

# Counts per key per UTC day. Create it with:
#   npx wrangler kv namespace create LIMITS
# and paste the id it prints in place of the placeholder below. (A namespace id is not a secret.)
[[kv_namespaces]]
binding = "LIMITS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# The library contributors' public keys, by kid: a key record is checked once, then kept here so the
# records after it can be checked. Create it with:
#   npx wrangler kv namespace create KEYS
# and paste the id it prints in place of the placeholder below.
[[kv_namespaces]]
binding = "KEYS"
id = "REPLACE_WITH_KEYS_NAMESPACE_ID"

# The audit log and the relay's daily counters (admin console). Create it with:
#   npx wrangler d1 create bbw-audit
# paste the database_id it prints in place of the placeholder, then apply the schema:
#   npx wrangler d1 execute bbw-audit --remote --file=schema.sql
[[d1_databases]]
binding = "AUDIT"
database_name = "bbw-audit"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
# The private repository the reports go to, "owner/name".
REPORTS_REPO = "REPLACE_WITH_OWNER/bbw-diagnostics"
# The shared coffee library, "owner/name". Records go to its `inbox` branch; status and index files
# are read from `main`.
LIBRARY_REPO = "REPLACE_WITH_OWNER/Community-Coffee"
# The admin console (/admin) is shut until both are set: the Zero Trust team name
# (<team>.cloudflareaccess.com) and the Access application's audience (AUD) tag.
ACCESS_TEAM = "REPLACE_WITH_ACCESS_TEAM"
ACCESS_AUD = "REPLACE_WITH_ACCESS_AUD"

# Secrets, set once with `npx wrangler secret put <NAME>` (never written here):
#   GITHUB_APP_KEY          the GitHub App's private key (.pem file contents)
#   GITHUB_APP_ID           the GitHub App's id
#   GITHUB_INSTALLATION_ID  the App's installation id on the reports repository
