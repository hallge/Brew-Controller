set_grind:
  fields:
    setting:
      required: true
      example: 54
      selector:
        number:
          min: 1
          max: 2000
          mode: box
    entry_id:
      selector:
        config_entry:
          integration: brew_by_weight
rate_shot:
  fields:
    rating:
      required: true
      selector:
        number:
          min: 0
          max: 5
          mode: slider
    taste:
      default: 0
      selector:
        select:
          options:
            - label: "Not said"
              value: "0"
            - label: "Sour"
              value: "1"
            - label: "Balanced"
              value: "2"
            - label: "Bitter"
              value: "3"
    shot_id:
      selector:
        number:
          min: 1
          max: 100000
          mode: box
    entry_id:
      selector:
        config_entry:
          integration: brew_by_weight
set_shot_tds:
  fields:
    tds:
      required: true
      selector:
        number:
          min: 0
          max: 25
          step: 0.01
          mode: box
    shot_id:
      selector:
        number:
          min: 1
          max: 100000
          mode: box
    entry_id:
      selector:
        config_entry:
          integration: brew_by_weight
bag_finished:
  fields:
    coffee_id:
      selector:
        number:
          min: 1
          max: 1000
          mode: box
    entry_id:
      selector:
        config_entry:
          integration: brew_by_weight
subscription_arrived:
  fields:
    subscription_id:
      required: true
      selector:
        number:
          min: 1
          max: 1000
          mode: box
    entry_id:
      selector:
        config_entry:
          integration: brew_by_weight
subscription_skip:
  fields:
    subscription_id:
      required: true
      selector:
        number:
          min: 1
          max: 1000
          mode: box
    entry_id:
      selector:
        config_entry:
          integration: brew_by_weight
maintenance_done:
  fields:
    job:
      required: true
      selector:
        select:
          options:
            - label: "Backflush"
              value: "backflush"
            - label: "Descale"
              value: "descale"
            - label: "Grinder clean"
              value: "grinder_clean"
    entry_id:
      selector:
        config_entry:
          integration: brew_by_weight
