name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host tests (brew logic, protocols)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        run: CXX=g++ bash test/host/run.sh

  firmware:
    name: Firmware build (T-Display S3 AMOLED Plus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build
        run: pio run
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            .pio/build/*/firmware.bin
            .pio/build/*/bootloader.bin
            .pio/build/*/partitions.bin
          if-no-files-found: error
