; Brew-by-weight controller: Breville Dual Boiler + Acaia Lunar + SwitchBot Bot
; Board: LILYGO T-Display S3 AMOLED Plus (1.91" RM67162, ESP32-S3R8, 16 MB flash)

[platformio]
default_envs = t-display-s3-amoled-plus
boards_dir = boards

[env:t-display-s3-amoled-plus]
; Arduino-ESP32 2.0.x: LilyGo-AMOLED-Series requires core < 3.0.
platform = espressif32@6.12.0
framework = arduino
board = T-Display-AMOLED
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
; Mozilla's root certificates, for reading shops' pages for subscription cards (certs/gen_cert_bundle.py)
board_build.embed_files = certs/x509_crt_bundle.bin
; Packs browser-extension/ into .pio/gen/ExtensionZip.h, served at /extension.zip.
; scripts/addons.py: the add-ons listed in BBW_ADDONS or addons.local.txt (none: the public firmware),
; .pio/gen/AddonList.h and their sources (docs/ADDONS.md).
extra_scripts =
    pre:scripts/gen_extension.py
    pre:scripts/addons.py
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
    ; lib/elf_loader (add-on modules): what its Kconfig would set. The project must see the same, the loader's
    ; esp_elf_t layout depends on it. Module code goes to PSRAM, reached through the instruction-bus alias.
    -DCONFIG_ELF_LOADER=1
    -DCONFIG_ELF_LOADER_LOAD_PSRAM=1
    -DCONFIG_ELF_LOADER_CACHE_OFFSET=1
    -DCONFIG_ELF_LOADER_BUS_ADDRESS_MIRROR=1
    -DCONFIG_ELF_LOADER_NUMBER_SYMBOLS=4
    -Iinclude
    -I.pio/gen
    -Isrc
lib_deps =
    https://github.com/Xinyuan-LilyGO/LilyGo-AMOLED-Series.git#v1.2.4
    lvgl/lvgl @ 8.4.0
    lewisxhe/XPowersLib @ 0.2.7
    lewisxhe/SensorLib @ 0.2.4
    h2zero/NimBLE-Arduino @ 1.4.3
    bblanchon/ArduinoJson @ ^7.2.0
    knolleary/PubSubClient @ 2.8
; lib/ScaleWire is the clean-room copy of the scale tables, used by BBW_CLEAN host builds and the
; iOS app (research/obbw-clean-spec.md). The firmware keeps lib/EspressoScaleProtocol for now.
lib_ignore = ScaleWire
