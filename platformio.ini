; Brew-by-weight controller: Breville Dual Boiler + Acaia Lunar + SwitchBot Bot
; Board: LILYGO T-Display S3 AMOLED Plus (1.91" RM67162, ESP32-S3R8, 16 MB flash)

[platformio]
default_envs = t-display-s3-amoled-plus
boards_dir = boards

[env:t-display-s3-amoled-plus]
; Arduino-ESP32 2.0.x: LilyGo-AMOLED-Series requires core < 3.0.
platform = espressif32@6.12.0
framework = arduino
board = T-Display-AMOLED
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
; Mozilla's root certificates, for reading shops' pages for subscription cards (certs/gen_cert_bundle.py)
board_build.embed_files = certs/x509_crt_bundle.bin
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
    -Iinclude
    -Isrc
lib_deps =
    https://github.com/Xinyuan-LilyGO/LilyGo-AMOLED-Series.git#v1.2.4
    lvgl/lvgl @ 8.4.0
    lewisxhe/XPowersLib @ 0.2.7
    lewisxhe/SensorLib @ 0.2.4
    h2zero/NimBLE-Arduino @ 1.4.3
    bblanchon/ArduinoJson @ ^7.2.0
