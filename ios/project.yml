name: BrewController
# XcodeGen project for the iPhone app that runs the board's own firmware in-process.
# Generate with:  cd ios && xcodegen generate
#
# The firmware (src/main.cpp, Web.cpp, Ble.cpp, Store.cpp, core/ ...) is compiled from where it lives,
# by path, never copied, with the same source list, flags and include order as test/hostapp/run.sh
# (keep the two in step). No LVGL, no Ui.cpp, no OBBW code.
options:
  bundleIdPrefix: com.hallge
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2"
    CODE_SIGN_STYLE: Automatic
    CLANG_CXX_LANGUAGE_STANDARD: gnu++17
    CLANG_CXX_LIBRARY: libc++
    # emu/shims shadows names (Arduino.h, WiFi.h ...): resolve only through the search paths below.
    USE_HEADERMAP: NO

targets:
  BrewController:
    type: application
    platform: iOS
    sources:
      - path: BrewControllerApp
      # ---- the firmware, by path (test/hostapp/run.sh FIRMWARE) ----
      - path: ../src/main.cpp
        group: Firmware
      - path: ../src/Log.cpp
        group: Firmware
      - path: ../src/platform/FirmwareUpdate.cpp
        group: Firmware/platform
      - path: ../src/ble/Ble.cpp
        group: Firmware/ble
      - path: ../src/core/BrewController.cpp
        group: Firmware/core
      - path: ../src/net/Web.cpp
        group: Firmware/net
      - path: ../src/net/ScreenApi.cpp
        group: Firmware/net
      - path: ../src/addons/AddonHost.cpp
        group: Firmware/addons
      - path: ../src/storage/Store.cpp
        group: Firmware/storage
      - path: ../src/storage/Backup.cpp
        group: Firmware/storage
      - path: ../lib/ScaleWire/src
        group: Firmware/ScaleWire
        includes:
          - "*.cpp"
      # ---- the PC emulator's portable stand-ins ----
      - path: ../emu/src/host_runtime.cpp
        group: Emu
      - path: ../emu/src/host_web.cpp
        group: Emu
      - path: ../emu/src/ble_facade.cpp
        group: Emu
      - path: ../emu/src/virtual_radio.cpp
        group: Emu
      - path: ../emu/src/emu_devices.cpp
        group: Emu
      # ---- the iPhone host ----
      - path: Host/BrewHost.cpp
      - path: Host/host_stubs.cpp
      - path: Host/ui_stub.cpp
      - path: Host/ble_corebluetooth.mm
      - path: Host/ios_runtime.mm
      - path: Host/BrewHostExtras.cpp
      # Networking: URLSession, MQTT and the P-256 device key (ios/Host/NET.md).
      - path: Host/net_portable.cpp
      - path: Host/mqtt_client.cpp
      - path: Host/ios_net.mm
      - path: Host/ios_devicekey.mm
      # Headers, shown in Xcode only.
      - path: Host
        buildPhase: none
        includes:
          - "*.h"
    dependencies:
      - sdk: CoreBluetooth.framework
      - sdk: Security.framework
    info:
      path: BrewControllerApp/Info.plist
      properties:
        CFBundleDisplayName: Brew Controller
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Standard system cryptography only: nothing to declare on App Store Connect.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: Brew Controller talks to your scale and your brew bot over Bluetooth to pull a shot to its target weight.
        NSLocalNetworkUsageDescription: Brew Controller talks to Home Assistant and other devices on your home network.
        UIBackgroundModes:
          - bluetooth-central
        # Plain http to devices on the home network only (Home Assistant, .local names): ios/Host/NET.md.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hallge.brewcontroller
        PRODUCT_NAME: BrewController
        PRODUCT_MODULE_NAME: BrewController
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        SKIP_INSTALL: NO
        # One plain-C API, no Swift C++ interop: the bridging header imports only plain-C headers.
        SWIFT_OBJC_BRIDGING_HEADER: BrewControllerApp/BrewHost-Bridging-Header.h
        # dladdr finds the RTC section in the image that holds the firmware: keep it in one binary.
        ENABLE_DEBUG_DYLIB: NO
        # Same defines as test/hostapp/run.sh.
        GCC_PREPROCESSOR_DEFINITIONS:
          - $(inherited)
          - BBW_EMULATOR
          - BBW_HOST_IOS
          - BBW_CLEAN
          # The real network and device key (ios_net.mm, ios_devicekey.mm) instead of net_portable.cpp's stand-ins.
          - BBW_IOS_NATIVE_NET
          - CONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
          - ARDUINOJSON_ENABLE_ARDUINO_STRING=1
          - ARDUINOJSON_ENABLE_ARDUINO_PRINT=1
        # Same order as run.sh: -Iios/Host -Iemu/shims -Iemu/src -Isrc -Iios/Generated -Ilib/ScaleWire/src -I<ArduinoJson>
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Host
          - $(SRCROOT)/../emu/shims
          - $(SRCROOT)/../emu/src
          - $(SRCROOT)/../src
          - $(SRCROOT)/Generated
          - $(SRCROOT)/../lib/ScaleWire/src
          - $(SRCROOT)/Vendor/ArduinoJson/src
        # run.sh builds with -Wno-c++11-narrowing.
        OTHER_CPLUSPLUSFLAGS: "$(inherited) -Wno-c++11-narrowing -Wno-nullability-completeness"
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: $(APP_PROFILE)

  # Hosted in the app: the controller is compiled once, into the app, and the tests call it there.
  BrewCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BrewCoreTests
      # The Swift core layer's tests; Fixtures/ is read by #filePath, not bundled.
      - path: BrewControllerTests
        excludes:
          - "Fixtures/**"
    dependencies:
      - target: BrewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hallge.brewcontroller.coretests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/BrewController.app/BrewController
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_OBJC_BRIDGING_HEADER: BrewCoreTests/BrewCoreTests-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Host

  BrewControllerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BrewControllerUITests
    dependencies:
      - target: BrewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hallge.brewcontroller.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BrewController

schemes:
  BrewController:
    build:
      targets:
        BrewController: all
        BrewCoreTests: [test]
        BrewControllerUITests: [test]
    test:
      config: Debug
      targets:
        - BrewCoreTests
        - BrewControllerUITests
    archive:
      config: Release

  BrewControllerRelease:
    build:
      targets:
        BrewController: all
    archive:
      config: Release
